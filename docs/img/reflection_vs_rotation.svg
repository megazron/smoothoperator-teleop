<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="context-stroke"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1f77b4"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d62728"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2ca02c"/></marker>
    <marker id="ak" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#555"/></marker>
  </defs>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Operator faces the wearer. Copying a facing person is a reflection, not a rotation.</text>

  <!-- ===== left panel: reflection ===== -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="450" height="350" rx="8" fill="#fff5f5" stroke="#d62728" stroke-width="1.2"/>
    <text x="225" y="24" text-anchor="middle" font-weight="bold" fill="#d62728">"They're facing me, so mirror it"   det(R) = −1</text>
    <!-- operator -->
    <g transform="translate(90,150)">
      <circle cx="0" cy="-40" r="14" fill="none" stroke="#555" stroke-width="2"/>
      <line x1="0" y1="-26" x2="0" y2="20" stroke="#555" stroke-width="2"/>
      <line x1="0" y1="-10" x2="30" y2="-2" stroke="#555" stroke-width="2"/>
      <text x="0" y="46" text-anchor="middle" fill="#555">operator</text>
      <!-- hand motion: towards robot (+) and roll -->
      <line x1="34" y1="-2" x2="110" y2="-2" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#ab)"/>
      <text x="72" y="-10" text-anchor="middle" fill="#1f77b4" font-size="12">hand towards robot</text>
      <path d="M 58 12 A 14 14 0 1 1 86 12" fill="none" stroke="#2ca02c" stroke-width="2.5" marker-end="url(#ag)"/>
      <text x="72" y="44" text-anchor="middle" fill="#2ca02c" font-size="12">wrist rolls clockwise</text>
    </g>
    <!-- mirror line -->
    <line x1="225" y1="60" x2="225" y2="300" stroke="#d62728" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="225" y="315" text-anchor="middle" fill="#d62728" font-size="12">mirror plane</text>
    <!-- wearer + robot -->
    <g transform="translate(360,150)">
      <circle cx="0" cy="-40" r="14" fill="none" stroke="#555" stroke-width="2"/>
      <line x1="0" y1="-26" x2="0" y2="20" stroke="#555" stroke-width="2"/>
      <rect x="-30" y="-24" width="14" height="40" rx="3" fill="#ddd" stroke="#555"/>
      <text x="0" y="46" text-anchor="middle" fill="#555">wearer + arm</text>
      <line x1="-34" y1="-2" x2="-110" y2="-2" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#ab)"/>
      <text x="-72" y="-10" text-anchor="middle" fill="#1f77b4" font-size="12">gripper moves in ✓</text>
      <path d="M -86 12 A 14 14 0 1 0 -58 12" fill="none" stroke="#d62728" stroke-width="2.5" marker-end="url(#ar)"/>
      <text x="-72" y="44" text-anchor="middle" fill="#d62728" font-size="12">gripper rolls anticlockwise ✗</text>
    </g>
    <text x="225" y="338" text-anchor="middle" fill="#333" font-size="12">positions land where you expect, every orientation comes out mirrored</text>
  </g>

  <!-- ===== right panel: yaw only ===== -->
  <g transform="translate(490,50)">
    <rect x="0" y="0" width="450" height="350" rx="8" fill="#f3f8fd" stroke="#1f77b4" stroke-width="1.2"/>
    <text x="225" y="24" text-anchor="middle" font-weight="bold" fill="#1f77b4">Yaw measured from one known motion   det(R) = +1</text>
    <!-- operator frame -->
    <g transform="translate(110,190)">
      <line x1="0" y1="0" x2="0" y2="-90" stroke="#555" stroke-width="2" marker-end="url(#ak)"/>
      <line x1="0" y1="0" x2="90" y2="0" stroke="#555" stroke-width="2" marker-end="url(#ak)"/>
      <text x="6" y="-80" fill="#555" font-size="12">tracker +y</text>
      <text x="62" y="16" fill="#555" font-size="12">tracker +x</text>
      <line x1="0" y1="0" x2="64" y2="-64" stroke="#1f77b4" stroke-width="3" marker-end="url(#ab)"/>
      <text x="40" y="-70" fill="#1f77b4" font-size="12">1. "move towards the robot"</text>
      <line x1="0" y1="0" x2="64" y2="64" stroke="#2ca02c" stroke-width="3" marker-end="url(#ag)"/>
      <text x="40" y="84" fill="#2ca02c" font-size="12">2. "now to your right" (a check)</text>
      <path d="M 0 -40 A 40 40 0 0 1 28 -28" fill="none" stroke="#e07b39" stroke-width="2" marker-end="url(#a)"/>
      <text x="8" y="-46" fill="#e07b39" font-size="12">yaw ψ</text>
    </g>
    <!-- equals: robot frame -->
    <text x="235" y="195" text-anchor="middle" font-size="24" fill="#333">→</text>
    <g transform="translate(330,190)">
      <line x1="0" y1="0" x2="0" y2="-90" stroke="#555" stroke-width="2" marker-end="url(#ak)"/>
      <line x1="0" y1="0" x2="90" y2="0" stroke="#555" stroke-width="2" marker-end="url(#ak)"/>
      <text x="6" y="-80" fill="#555" font-size="12">world +y (wearer fwd)</text>
      <text x="58" y="16" fill="#555" font-size="12">world +x</text>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#1f77b4" stroke-width="3" marker-end="url(#ab)"/>
      <text x="6" y="70" fill="#1f77b4" font-size="12">= world −y</text>
      <line x1="0" y1="0" x2="-80" y2="0" stroke="#2ca02c" stroke-width="3" marker-end="url(#ag)"/>
      <text x="-84" y="-8" fill="#2ca02c" font-size="12">must still be ⟂</text>
    </g>
    <text x="225" y="300" text-anchor="middle" fill="#333" font-size="12">R = Rz(ψ). One known direction fixes one unknown angle;</text>
    <text x="225" y="318" text-anchor="middle" fill="#333" font-size="12">the second motion must stay perpendicular and horizontal or the fit is refused.</text>
    <text x="225" y="338" text-anchor="middle" fill="#333" font-size="12">A pure yaw can never produce a mirror: orientations follow correctly.</text>
  </g>
  <text x="480" y="420" text-anchor="middle" fill="#666" font-size="12">fit_rotation() reports det(R) and flags a reflection; solve_yaw_deg() + assess() implement the right-hand panel.</text>
</svg>
